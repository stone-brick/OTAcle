port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/otacle_remote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
